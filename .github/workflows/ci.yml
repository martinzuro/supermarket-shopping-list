name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # No Supabase in CI: placeholder values so the client builds. The app
      # cannot reach them, so the e2e run exercises the offline path.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54331
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Stack local de Supabase (CLI de devDependencies, la misma versión que
      # en local) con solo lo que usan los e2e: Postgres, Auth, PostgREST,
      # Realtime (Fase 2b), Kong, que expone la API en el puerto 54331, y
      # Mailpit (Fase 2c), donde los e2e leen el código de los correos de
      # Auth para convertir una cuenta por el flujo real.
      - name: Start Supabase
        run: >
          npx supabase start
          -x imgproxy,studio,edge-runtime,logflare,vector,supavisor,storage-api,postgres-meta

      # Las claves del stack local se incrustan en el build (NEXT_PUBLIC_) y
      # la secreta queda solo en Node, para e2e/supabase-admin.ts.
      - name: Export Supabase keys
        run: |
          status="$(npx supabase status -o json 2>/dev/null)"
          secret="$(jq -r .SECRET_KEY <<<"$status")"
          echo "::add-mask::$secret"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL <<<"$status")"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r .PUBLISHABLE_KEY <<<"$status")"
            echo "E2E_SUPABASE=1"
            echo "E2E_SUPABASE_SECRET_KEY=$secret"
          } >> "$GITHUB_ENV"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Capturas de e2e/visual.spec.ts (claro, oscuro, movimiento reducido)
      # y trazas de reintentos, para revisarlas sin abrir el informe.
      - name: Upload screenshots and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
